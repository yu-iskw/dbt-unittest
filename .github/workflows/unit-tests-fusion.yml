name: Unit tests with Fusion
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
# TODO uncomment when the workflow gets stable.
#    paths:
#      - macros/
#      - integration_tests/macros/

jobs:
  test-dbt-fusion:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dbt Fusion
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --update
      - name: Run unit tests
        id: run-unit-tests
        working-directory: "${{ github.workspace }}/integration_tests"
        run: |
          # dbt Fusion 2.x supports duckdb but not the postgres adapter.
          bash run_unit_tests.sh --target duckdb
      # Save artifacts for debug
      - name: Save logs and artifacts if failed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: save-logs-and-target-fusion
          retention-days: 3
          path: |
            integration_tests/logs
            integration_tests/target
      - id: exit
        if: ${{ steps.run-unit-tests.outcome == 'failure' }}
        run: |
          exit 1
