services:
  postgres:
    image: postgres:15
    container_name: dbt-unittest-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbt_unittest
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dbt_unittest"]
      interval: 2s
      timeout: 5s
      retries: 30
